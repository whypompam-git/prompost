name: LINE digest hourly

# Vercel's free cron runs once a day (08:00 Thai time, see vercel.json). Channels
# with other send hours need something to poke the endpoint every hour — this.
# It does nothing until the CRON_SECRET repo secret exists (same value as the
# CRON_SECRET in Vercel).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Call the dispatcher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET secret not set in GitHub — hourly LINE dispatch skipped."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://prompost.vercel.app/api/cron/line-digest
