name: Weekly data backup

on:
  schedule:
    - cron: "0 20 * * 6" # Saturday 20:00 UTC = Sunday 03:00 Bangkok
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dump data to the private "backups" bucket
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Supabase secrets not set in GitHub Actions — backup skipped. Add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY (see ENVIRONMENTS.md)."
            exit 0
          fi
          node scripts/backup.mjs
