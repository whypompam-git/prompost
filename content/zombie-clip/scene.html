// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const backOut = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, k) { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(",")})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(w, s) { ctx.font = `${w} ${s}px ${FONT}`; }
function text(str, x, y, { size = 48, weight = 800, color = "#fff", align = "center", stroke = 0, strokeColor = "rgba(0,0,0,.85)", base = "middle", maxW = 0 } = {}) {
  font(weight, size);
  if (maxW) { while (ctx.measureText(str).width > maxW && size > 18) { size -= 2; font(weight, size); } }
  ctx.textAlign = align; ctx.textBaseline = base;
  if (stroke) { ctx.lineJoin = "round"; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

const SCENES = [[0, 5, scene1], [5, 15, scene2], [15, 26, scene3], [26, 40, scene4], [40, 51, scene5], [51, 61, scene6], [61, 73.2, scene7], [73.2, 84, scene8]];
window.DURATION = 84;

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const sc = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  ctx.save();
  // camera shake on impacts
  const shakeAt = [1.2, 26.0, 55.6];
  for (const s of shakeAt) { const k = 1 - seg(t, s, s + 0.4); if (t >= s && k > 0) { const r = rng(Math.floor(t * 60)); ctx.translate((r() - 0.5) * 30 * k, (r() - 0.5) * 30 * k); } }
  sc[2](t);
  ctx.restore();
  vignette(sc[2] === scene7 ? 0.35 : 0.6);
  grain(t, sc[0] < 26 ? 0.05 : 0.025);
  // fade through black at scene edges (except the slam cut into scene 4)
  for (const [a] of SCENES) { if (a === 0 || a === 26) continue; const d = Math.abs(t - a); if (d < 0.22) { ctx.fillStyle = `rgba(0,0,0,${1 - d / 0.22})`; ctx.fillRect(0, 0, W, H); } }
  // watermark
  if (logo.complete && t > 5) { ctx.globalAlpha = 0.55; ctx.drawImage(logo, W - 130, 40, 80, 80); ctx.globalAlpha = 1; }
  caption(t);
}
window.render = render;
window.ready = Promise.all([document.fonts.load('800 40px K'), document.fonts.load('600 40px K'), document.fonts.load('400 40px K'), document.fonts.load('40px "Noto Color Emoji"'), new Promise((r) => { logo.onload = r; if (logo.complete) r(); })]).then(() => document.fonts.ready);
</script></body></html>
